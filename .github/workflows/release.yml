name: Release

# Manually triggered: releasing is a deliberate choice, not something that
# should happen on every push to main. Run it from the Actions tab, or:
#   gh workflow run release.yml -f version=1.2.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (major.minor.patch, no leading v)'
        required: true
        type: string

# Needed to commit the version bump + rebuilt dist/, tag, and push back to
# this repo. Scoped to this workflow only, and only to this repo — the
# built-in GITHUB_TOKEN never needs an SSH key or personal access token.
permissions:
  contents: write

jobs:
  release:
    name: Build, tag and push
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be major.minor.patch, e.g. 1.2.0 (got '${{ inputs.version }}')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the tag step and future `git describe`-style tooling work

      - name: Fail if tag already exists
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bump package.json version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag
        run: |
          git add package.json dist
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"

      - name: Push
        run: git push origin HEAD:main --follow-tags

      - name: Summary
        run: |
          echo "### Released v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tools pinned with \`#semver:\` ranges will pick this up the next time" >> "$GITHUB_STEP_SUMMARY"
          echo "they run \`npm update @ff8-speedruns/ui\`. Nothing updates automatically." >> "$GITHUB_STEP_SUMMARY"
